<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachel Gijon</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon_io/favicon.ico">
    <!-- CSS -->
    <link rel="stylesheet" href="./styles/main.css">
    <!-- Components -->
    <script src="./components/card.js" type="module" defer></script>
  </head>
  <body>
    <div class="main-container">
      <!-- ---------------------------- Hero section ----------------------------- -->
      <header id="hero">
        <!-- wrapper to keep content inside container while bg extends -->
        <div class="hero-content-wrapper">
          <!-- image -->
          <div class="profile-col">
            <img src="https://placehold.co/260" alt="profile pic" class="profile-img">
          </div>
          <!-- hero text + buttons -->
          <div>
            <h1 class="hero-title">Rachel Gijon</h1>
            <h2 class="hero-subtitle">Software Engineer</h2>
            <p class="hero-paragraph">I am a software engineer with a passion for creating and developing web applications.  I have experience in front-end and back-end development, and I am always looking for new challenges to improve my skills.</p>
            <div class="hero-buttons">
                <button class="button" type="button">Download Resume</button>
                <a class="button" href="/">Contact Me</a>
            </div>
          </div>
        </div>
      </header>

      <!-- -------------------------- Skills section --------------------------- -->
      <section id="skills">
        <h1 class="section-title">My Skills</h1>
          <card-comp></card-comp>
      </section>
    </div>
  </body>
</html>
